name: Lung Cancer MLOps CI

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "Select ML algorithm"
        required: true
        default: "logistic_regression"
        type: choice
        options:
          - logistic_regression
          - random_forest
          - svm

jobs:

  ml-pipeline:

    runs-on: ubuntu-latest

    env:

      # ==================================================
      # MLflow
      # ==================================================

      # CHANGE THIS to your NEW MLflow EC2 public IP
      MLFLOW_TRACKING_URI: http://16.176.157.241:5000

      MLFLOW_EXPERIMENT: LungCancerPrediction


      # ==================================================
      # AWS
      # ==================================================

      AWS_REGION: ap-southeast-2

      # CHANGE THIS to your CURRENT AWS account ID
      AWS_ACCOUNT_ID: "962453725761"

      # CHANGE THIS to your S3 bucket
      S3_BUCKET: lung-cancer-mlops234


      # ==================================================
      # ECR
      # ==================================================

      ECR_REPOSITORY: lung-cancer


      # ==================================================
      # Algorithm
      # ==================================================

      ALGORITHM: ${{ inputs.algorithm }}


    permissions:
      contents: read


    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # 3. Install Python dependencies
      # ==================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==================================================
      # 4. Configure AWS credentials
      #
      # NO OIDC
      # Uses GitHub Repository Secrets
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:

          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

          aws-region: ${{ env.AWS_REGION }}


      # ==================================================
      # 5. Verify AWS
      # ==================================================

      - name: Verify AWS identity
        run: |

          echo "======================================"
          echo "AWS IDENTITY"
          echo "======================================"

          aws sts get-caller-identity


      # ==================================================
      # 6. Show configuration
      # ==================================================

      - name: Show configuration
        run: |

          echo "======================================"
          echo "LUNG CANCER MLOps CI PIPELINE"
          echo "======================================"

          echo "Algorithm:"
          echo "${ALGORITHM}"

          echo "MLflow Experiment:"
          echo "${MLFLOW_EXPERIMENT}"

          echo "MLflow Tracking URI:"
          echo "${MLFLOW_TRACKING_URI}"

          echo "S3 Bucket:"
          echo "${S3_BUCKET}"

          echo "ECR Repository:"
          echo "${ECR_REPOSITORY}"

          echo "Git Commit:"
          echo "${GITHUB_SHA}"

          echo "======================================"


      # ==================================================
      # 7. Test MLflow connection
      # ==================================================

      - name: Test MLflow connection
        run: |

          echo "======================================"
          echo "TESTING MLFLOW CONNECTION"
          echo "======================================"

          curl --fail \
            --max-time 20 \
            "${MLFLOW_TRACKING_URI}/health"

          echo ""

          echo "MLflow server is reachable."


      # ==================================================
      # 8. Preprocess
      # ==================================================

      - name: Preprocess data
        run: |

          echo "======================================"
          echo "PREPROCESSING DATA"
          echo "======================================"

          python src/preprocess.py

          echo ""
          echo "Checking artifacts..."

          ls -lh artifacts/

          test -f artifacts/train.csv

          test -f artifacts/test.csv

          echo ""
          echo "Preprocessing completed successfully."


      # ==================================================
      # 9. Train
      # ==================================================

      - name: Train model
        run: |

          echo "======================================"
          echo "TRAINING MODEL"
          echo "======================================"

          echo "Algorithm:"
          echo "${ALGORITHM}"

          python src/train.py

          echo ""
          echo "Checking model directory..."

          ls -lh model/

          test -f model/model.pkl

          echo ""
          echo "Model training completed successfully."


      # ==================================================
      # 10. Evaluate
      # ==================================================

      - name: Evaluate model
        run: |

          echo "======================================"
          echo "EVALUATING MODEL"
          echo "======================================"

          python src/evaluate.py

          echo ""
          echo "Evaluation completed successfully."


      # ==================================================
      # 11. Inference test
      # ==================================================

      - name: Run inference
        run: |

          echo "======================================"
          echo "RUNNING INFERENCE TEST"
          echo "======================================"

          python src/inference.py

          echo ""
          echo "Inference completed successfully."


      # ==================================================
      # 12. Unit tests
      # ==================================================

      - name: Run tests
        run: |

          echo "======================================"
          echo "RUNNING PYTEST"
          echo "======================================"

          pytest -v

          echo ""
          echo "Tests completed successfully."


      # ==================================================
      # 13. Verify application files
      # ==================================================

      - name: Verify application files
        run: |

          echo "======================================"
          echo "CHECKING DOCKER APPLICATION FILES"
          echo "======================================"

          echo "Repository files:"
          ls -la

          echo ""
          echo "Model directory:"
          ls -lh model/

          test -f app.py

          test -f Dockerfile

          test -f requirements.txt

          test -f model/model.pkl

          echo ""
          echo "app.py found"

          echo "Dockerfile found"

          echo "requirements.txt found"

          echo "model/model.pkl found"


      # ==================================================
      # 14. Upload processed datasets to S3
      # ==================================================

      - name: Upload processed datasets to S3
        run: |

          echo "======================================"
          echo "UPLOADING DATASETS TO S3"
          echo "======================================"

          aws s3 cp \
            artifacts/train.csv \
            s3://${S3_BUCKET}/artifacts/train.csv

          aws s3 cp \
            artifacts/test.csv \
            s3://${S3_BUCKET}/artifacts/test.csv

          echo ""
          echo "Processed datasets uploaded."


      # ==================================================
      # 15. Upload model to S3
      # ==================================================

      - name: Upload model to S3
        run: |

          echo "======================================"
          echo "UPLOADING MODEL TO S3"
          echo "======================================"

          aws s3 cp \
            model/model.pkl \
            s3://${S3_BUCKET}/models/${ALGORITHM}/model.pkl

          echo ""
          echo "Model uploaded successfully."


      # ==================================================
      # 16. Upload evaluation results if available
      # ==================================================

      - name: Upload evaluation results
        run: |

          echo "======================================"
          echo "UPLOADING EVALUATION RESULTS"
          echo "======================================"

          if [ -d "evaluation" ]; then

            aws s3 cp \
              evaluation/ \
              s3://${S3_BUCKET}/evaluation/ \
              --recursive

          else

            echo "No evaluation directory found."

          fi


      # ==================================================
      # 17. Verify S3
      # ==================================================

      - name: Verify S3 artifacts
        run: |

          echo "======================================"
          echo "S3 ARTIFACTS"
          echo "======================================"

          aws s3 ls \
            s3://${S3_BUCKET}/artifacts/ \
            --recursive

          echo ""

          echo "======================================"
          echo "S3 MODELS"
          echo "======================================"

          aws s3 ls \
            s3://${S3_BUCKET}/models/ \
            --recursive

          echo ""

          echo "======================================"
          echo "S3 EVALUATION"
          echo "======================================"

          aws s3 ls \
            s3://${S3_BUCKET}/evaluation/ \
            --recursive


      # ==================================================
      # 18. Login to Amazon ECR
      # ==================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 19. Create unique Docker image tag
      # ==================================================

      - name: Create Docker image tag
        run: |

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          IMAGE_TAG="${ALGORITHM}-${SHORT_SHA}"

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> $GITHUB_ENV

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

          echo ""
          echo "======================================"
          echo "DOCKER IMAGE"
          echo "======================================"

          echo "Registry:"
          echo "${ECR_REGISTRY}"

          echo "Repository:"
          echo "${ECR_REPOSITORY}"

          echo "Tag:"
          echo "${IMAGE_TAG}"

          echo "Image:"
          echo "${IMAGE_URI}"

          echo "======================================"


      # ==================================================
      # 20. Build Docker image
      # ==================================================

      - name: Build Docker image
        run: |

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          docker build \
            --pull \
            -t "${IMAGE_URI}" \
            .

          echo ""

          echo "Docker image built successfully."

          docker images


      # ==================================================
      # 21. Test Docker image locally
      # ==================================================

      - name: Test Docker image
        run: |

          echo "======================================"
          echo "TESTING DOCKER IMAGE"
          echo "======================================"

          docker run \
            -d \
            --name lung-cancer-test \
            -p 8000:8000 \
            "${IMAGE_URI}"

          echo "Waiting for application..."

          sleep 10

          echo ""
          echo "Container status:"

          docker ps -a

          echo ""
          echo "Container logs:"

          docker logs lung-cancer-test || true

          echo ""
          echo "Testing health endpoint..."

          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8000/health

          echo ""

          echo "Testing root endpoint..."

          curl --fail \
            --retry 5 \
            --retry-delay 2 \
            http://localhost:8000/

          echo ""

          echo "Docker application test successful."

          docker stop lung-cancer-test

          docker rm lung-cancer-test


      # ==================================================
      # 22. Push Docker image to ECR
      # ==================================================

      - name: Push Docker image to ECR
        run: |

          echo "======================================"
          echo "PUSHING DOCKER IMAGE TO ECR"
          echo "======================================"

          docker push "${IMAGE_URI}"

          echo ""

          echo "Docker image pushed successfully."

          echo "${IMAGE_URI}"


      # ==================================================
      # 23. Verify ECR image
      # ==================================================

      - name: Verify ECR image
        run: |

          echo "======================================"
          echo "VERIFYING ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}"

          echo ""

          echo "ECR image verified successfully."


      # ==================================================
      # 24. Pipeline completed
      # ==================================================

      - name: Pipeline completed
        run: |

          echo ""
          echo "======================================"
          echo "LUNG CANCER MLOps CI SUCCESS"
          echo "======================================"

          echo ""
          echo "Algorithm:"
          echo "${ALGORITHM}"

          echo ""
          echo "MLflow Experiment:"
          echo "${MLFLOW_EXPERIMENT}"

          echo ""
          echo "MLflow Tracking URI:"
          echo "${MLFLOW_TRACKING_URI}"

          echo ""
          echo "S3 Model:"
          echo "s3://${S3_BUCKET}/models/${ALGORITHM}/model.pkl"

          echo ""
          echo "Docker Image:"
          echo "${IMAGE_URI}"

          echo ""
          echo "Git Commit:"
          echo "${GITHUB_SHA}"

          echo ""
          echo "======================================"
          echo "PIPELINE COMPLETED SUCCESSFULLY"
          echo "======================================"
