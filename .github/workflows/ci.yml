name: Lung Cancer MLOps CI

on:
  workflow_dispatch: 

jobs:

  ml-pipeline:

    runs-on: self-hosted

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MLflow URI
        run: |
          echo "MLFLOW_TRACKING_URI=http://32.198.38.148:5000/" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v

      - name: Preprocess data
        run: |
          python src/preprocess.py

      - name: Train model
        run: |
          python src/train.py

      - name: Evaluate model
        run: |
          python src/evaluate.py
