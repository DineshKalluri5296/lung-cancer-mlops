name: Lung Cancer MLOps CI

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "Select ML algorithm"
        required: true
        default: "logistic_regression"
        type: choice
        options:
          - logistic_regression
          - random_forest
          - svm

jobs:

  ml-pipeline:

    runs-on: ubuntu-latest

    env:

      # ==================================================
      # MLflow
      # ==================================================

      MLFLOW_TRACKING_URI: http://44.204.120.215:5000
      MLFLOW_EXPERIMENT: LungCancerPrediction_mlops

      # ==================================================
      # AWS
      # ==================================================

      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "821656895219"

      S3_BUCKET: lung-cancer234 

      # ==================================================
      # ECR
      # ==================================================

      ECR_REPOSITORY: lung-cancer

      # ==================================================
      # Algorithm
      # ==================================================

      ALGORITHM: ${{ inputs.algorithm }}

    permissions:
      contents: read
      id-token: write

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # 3. Install Python dependencies
      # ==================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==================================================
      # 4. Configure AWS credentials
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::821656895219:role/GitHubActionsLungCancerRole
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # ==================================================
      # 5. Verify AWS
      # ==================================================

      - name: Verify AWS identity
        run: |

          aws sts get-caller-identity


      # ==================================================
      # 6. Show configuration
      # ==================================================

      - name: Show configuration
        run: |

          echo "======================================"
          echo "LUNG CANCER MLOps CI PIPELINE"
          echo "======================================"

          echo "Algorithm:"
          echo "${ALGORITHM}"

          echo "MLflow Experiment:"
          echo "${MLFLOW_EXPERIMENT}"

          echo "S3 Bucket:"
          echo "${S3_BUCKET}"

          echo "ECR Repository:"
          echo "${ECR_REPOSITORY}"

          echo "Git Commit:"
          echo "${GITHUB_SHA}"

          echo "======================================"


      # ==================================================
      # 7. Preprocess
      # ==================================================

      - name: Preprocess data
        run: |

          echo "Running preprocessing..."

          python src/preprocess.py

          echo "Checking artifacts..."

          ls -lh artifacts/

          test -f artifacts/train.csv
          test -f artifacts/test.csv

          echo "Preprocessing completed successfully."


      # ==================================================
      # 8. Train
      # ==================================================

      - name: Train model
        run: |

          echo "Training ${ALGORITHM} model..."

          python src/train.py

          echo "Checking model directory..."

          ls -lh model/

          test -f model/model.pkl

          echo "Model training completed successfully."


      # ==================================================
      # 9. Evaluate
      # ==================================================

      - name: Evaluate model
        run: |

          echo "Evaluating model..."

          python src/evaluate.py

          echo "Evaluation completed successfully."


      # ==================================================
      # 10. Inference test
      # ==================================================

      - name: Run inference
        run: |

          echo "Running inference test..."

          python src/inference.py

          echo "Inference completed successfully."


      # ==================================================
      # 11. Unit tests
      # ==================================================

      - name: Run tests
        run: |

          echo "Running pytest..."

          pytest -v

          echo "Tests completed successfully."


      # ==================================================
      # 12. Verify application files
      #
      # IMPORTANT FOR DOCKER IMAGE
      # ==================================================

      - name: Verify application files
        run: |

          echo "======================================"
          echo "Checking Docker application files"
          echo "======================================"

          echo "Repository files:"
          ls -la

          echo ""
          echo "Model directory:"
          ls -lh model/

          echo ""

          test -f app.py
          test -f Dockerfile
          test -f requirements.txt
          test -f model/model.pkl

          echo "app.py found"
          echo "Dockerfile found"
          echo "requirements.txt found"
          echo "model/model.pkl found"

          echo "======================================"


      # ==================================================
      # 13. Upload processed datasets to S3
      # ==================================================

      - name: Upload processed datasets to S3
        run: |

          echo "Uploading train.csv..."

          aws s3 cp \
            artifacts/train.csv \
            s3://${S3_BUCKET}/artifacts/train.csv


          echo "Uploading test.csv..."

          aws s3 cp \
            artifacts/test.csv \
            s3://${S3_BUCKET}/artifacts/test.csv


      # ==================================================
      # 14. Upload model to S3
      # ==================================================

      - name: Upload model to S3
        run: |

          echo "Uploading model..."

          aws s3 cp \
            model/model.pkl \
            s3://${S3_BUCKET}/models/${ALGORITHM}/model.pkl


      # ==================================================
      # 15. Verify S3
      # ==================================================

      - name: Verify S3 artifacts
        run: |

          echo "======================================"
          echo "S3 ARTIFACTS"
          echo "======================================"

          aws s3 ls \
            s3://${S3_BUCKET}/artifacts/

          echo ""

          echo "======================================"
          echo "S3 MODELS"
          echo "======================================"

          aws s3 ls \
            s3://${S3_BUCKET}/models/ \
            --recursive


      # ==================================================
      # 16. Login to Amazon ECR
      # ==================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 17. Create unique Docker image tag
      # ==================================================

      - name: Create Docker image tag
        run: |

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          IMAGE_TAG="${ALGORITHM}-${SHORT_SHA}"

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> $GITHUB_ENV
          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

          echo "======================================"
          echo "DOCKER IMAGE"
          echo "======================================"

          echo "Registry:"
          echo "${ECR_REGISTRY}"

          echo "Repository:"
          echo "${ECR_REPOSITORY}"

          echo "Tag:"
          echo "${IMAGE_TAG}"

          echo "Image:"
          echo "${IMAGE_URI}"

          echo "======================================"


      # ==================================================
      # 18. Build Docker image
      # ==================================================

      - name: Build Docker image
        run: |

          echo "======================================"
          echo "BUILDING DOCKER IMAGE"
          echo "======================================"

          docker build \
            --pull \
            -t "${IMAGE_URI}" \
            .

          echo ""
          echo "Docker image built successfully."

          docker images


      # ==================================================
      # 19. Test Docker image locally
      # ==================================================

      - name: Test Docker image
        run: |

          echo "======================================"
          echo "TESTING DOCKER IMAGE"
          echo "======================================"

          docker run \
            -d \
            --name lung-cancer-test \
            -p 8000:8000 \
            "${IMAGE_URI}"

          echo "Waiting for application..."

          sleep 10

          echo ""
          echo "Container status:"

          docker ps -a

          echo ""
          echo "Testing health endpoint..."

          curl --fail \
            http://localhost:8000/health

          echo ""
          echo "Testing root endpoint..."

          curl --fail \
            http://localhost:8000/

          echo ""
          echo "Docker application test successful."

          echo ""
          echo "Container logs:"

          docker logs lung-cancer-test

          docker stop lung-cancer-test
          docker rm lung-cancer-test


      # ==================================================
      # 20. Push Docker image to ECR
      # ==================================================

      - name: Push Docker image to ECR
        run: |

          echo "======================================"
          echo "PUSHING DOCKER IMAGE TO ECR"
          echo "======================================"

          docker push "${IMAGE_URI}"

          echo ""
          echo "Docker image pushed successfully."

          echo "${IMAGE_URI}"


      # ==================================================
      # 21. Verify ECR image
      # ==================================================

      - name: Verify ECR image
        run: |

          echo "======================================"
          echo "VERIFYING ECR IMAGE"
          echo "======================================"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}"

          echo ""
          echo "ECR image verified successfully."


      # ==================================================
      # 22. Pipeline completed
      # ==================================================

      - name: Pipeline completed
        run: |

          echo "======================================"
          echo "CI PIPELINE SUCCESS"
          echo "======================================"

          echo "Algorithm:"
          echo "${ALGORITHM}"

          echo ""

          echo "MLflow Experiment:"
          echo "${MLFLOW_EXPERIMENT}"

          echo ""

          echo "S3 Model:"
          echo "s3://${S3_BUCKET}/models/${ALGORITHM}/model.pkl"

          echo ""

          echo "Docker Image:"
          echo "${IMAGE_URI}"

          

          
