name: Lung Cancer MLOps CI

on:
  workflow_dispatch:
    inputs:
      algorithm:
        description: "Select ML algorithm"
        required: true
        default: "logistic_regression"
        type: choice
        options:
          - logistic_regression
          - random_forest
          - svm

jobs:

  ml-pipeline:

    runs-on: ubuntu-latest

    env:

      # ==================================================
      # MLflow
      # ==================================================

      MLFLOW_TRACKING_URI: http://100.60.81.211:5000/
      MLFLOW_EXPERIMENT: LungCancerPrediction212

      # ==================================================
      # AWS
      # ==================================================

      AWS_REGION: ap-south-1
      AWS_ACCOUNT_ID: "821656895219"

      S3_BUCKET: lung-cancer-prediction

      # ==================================================
      # ECR
      # ==================================================

      ECR_REPOSITORY: lung-cancer

      # ==================================================
      # Algorithm
      # ==================================================

      ALGORITHM: ${{ inputs.algorithm }}

    permissions:
      contents: read
      id-token: write

    steps:

      # ==================================================
      # 1. Checkout
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==================================================
      # 2. Setup Python
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ==================================================
      # 3. Install dependencies
      # ==================================================

      - name: Install dependencies
        run: |

          python -m pip install --upgrade pip

          pip install -r requirements.txt


      # ==================================================
      # 4. Configure AWS credentials
      # ==================================================

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::821656895219:role/GitHubActionsLungCancerRole1
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com


      # ==================================================
      # 5. Verify AWS
      # ==================================================

      - name: Verify AWS identity
        run: |

          aws sts get-caller-identity


      # ==================================================
      # 6. Display configuration
      # ==================================================

      - name: Show configuration
        run: |

          echo "======================================"

          echo "Lung Cancer MLOps Pipeline"

          echo "======================================"

          echo "Algorithm:"
          echo "${ALGORITHM}"

          echo "MLflow Experiment:"
          echo "${MLFLOW_EXPERIMENT}"

          echo "S3 Bucket:"
          echo "${S3_BUCKET}"

          echo "ECR Repository:"
          echo "${ECR_REPOSITORY}"

          echo "Git Commit:"
          echo "${GITHUB_SHA}"

          echo "======================================"


      # ==================================================
      # 7. Preprocess
      # ==================================================

      - name: Preprocess data
        run: |

          python src/preprocess.py

          echo "Checking artifacts..."

          ls -lh artifacts/


      # ==================================================
      # 8. Train
      # ==================================================

      - name: Train model
        run: |

          python src/train.py

          echo "Checking model..."

          ls -lh model/

          test -f model/model.pkl


      # ==================================================
      # 9. Evaluate
      # ==================================================

      - name: Evaluate model
        run: |

          python src/evaluate.py


      # ==================================================
      # 10. Inference
      # ==================================================

      - name: Run inference
        run: |

          python src/inference.py


      # ==================================================
      # 11. Tests
      # ==================================================

      - name: Run tests
        run: |

          pytest -v


      # ==================================================
      # 12. Upload processed datasets to S3
      # ==================================================

      - name: Upload processed datasets to S3
        run: |

          echo "Uploading train.csv..."

          aws s3 cp \
            artifacts/train.csv \
            s3://${S3_BUCKET}/artifacts/train.csv


          echo "Uploading test.csv..."

          aws s3 cp \
            artifacts/test.csv \
            s3://${S3_BUCKET}/artifacts/test.csv


      # ==================================================
      # 13. Upload model to S3
      # ==================================================

      - name: Upload model to S3
        run: |

          echo "Uploading model..."

          aws s3 cp \
            model/model.pkl \
            s3://${S3_BUCKET}/models/${ALGORITHM}/model.pkl


      # ==================================================
      # 14. Verify S3
      # ==================================================

      - name: Verify S3 artifacts
        run: |

          echo "======================================"

          echo "S3 Artifacts"

          echo "======================================"

          aws s3 ls \
            s3://${S3_BUCKET}/artifacts/


          echo "======================================"

          echo "S3 Models"

          echo "======================================"

          aws s3 ls \
            s3://${S3_BUCKET}/models/ \
            --recursive


      # ==================================================
      # 15. Login to Amazon ECR
      # ==================================================

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ==================================================
      # 16. Create Docker image tag
      # ==================================================

      - name: Create Docker image tag
        run: |

          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)

          IMAGE_TAG="${ALGORITHM}-${SHORT_SHA}"

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV

          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> $GITHUB_ENV

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV

          echo "IMAGE_URI=${IMAGE_URI}" >> $GITHUB_ENV

          echo "======================================"

          echo "Docker Image"

          echo "======================================"

          echo "Registry:"
          echo "${ECR_REGISTRY}"

          echo "Repository:"
          echo "${ECR_REPOSITORY}"

          echo "Tag:"
          echo "${IMAGE_TAG}"

          echo "Image:"
          echo "${IMAGE_URI}"

          echo "======================================"


      # ==================================================
      # 17. Build Docker image
      # ==================================================

      - name: Build Docker image
        run: |

          echo "Building Docker image..."

          docker build \
            -t "${IMAGE_URI}" \
            .

          echo "Docker image built successfully."

          docker images


      # ==================================================
      # 18. Push Docker image to ECR
      # ==================================================

      - name: Push Docker image to ECR
        run: |

          echo "Pushing Docker image..."

          docker push "${IMAGE_URI}"

          echo "Docker image pushed successfully."


      # ==================================================
      # 19. Verify ECR image
      # ==================================================

      - name: Verify ECR image
        run: |

          echo "======================================"

          echo "ECR Image"

          echo "======================================"

          aws ecr describe-images \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --region "${AWS_REGION}"

          echo "======================================"


      # ==================================================
      # 20. Pipeline completed
      # ==================================================

      - name: Pipeline completed
        run: |

          echo "======================================"

          echo "CI PIPELINE SUCCESS"

          echo "======================================"

          echo "Algorithm:"
          echo "${ALGORITHM}"

          echo ""

          echo "MLflow Experiment:"
          echo "${MLFLOW_EXPERIMENT}"

          echo ""

          echo "S3 Model:"
          echo "s3://${S3_BUCKET}/models/${ALGORITHM}/model.pkl"

          echo ""

          echo "Docker Image:"
          echo "${IMAGE_URI}"

          echo "======================================"

          echo "Ready for Phase 3"

          echo "EKS + Kubernetes + ArgoCD"

          echo "======================================"
