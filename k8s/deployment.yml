apiVersion: apps/v1
kind: Deployment
metadata:
  name: lung-cancer-api
  namespace: lung-cancer

spec:
  replicas: 2

  selector:
    matchLabels:
      app: lung-cancer-api

  template:
    metadata:
      labels:
        app: lung-cancer-api

    spec:
      containers:
        - name: lung-cancer-api

          image: 962453725761.dkr.ecr.ap-southeast-2.amazonaws.com/lung-cancer:logistic_regression-7bf0992


          ports:
            - containerPort: 8000

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
