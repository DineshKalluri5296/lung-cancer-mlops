apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: lung-cancer-mlops
  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/YOUR-GITHUB-USERNAME/lung-cancer-mlops.git

    targetRevision: main

    path: k8s

  destination:

    server: https://kubernetes.default.svc

    namespace: lung-cancer

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true